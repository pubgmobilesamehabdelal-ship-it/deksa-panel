<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة شحن وكلاء DEKSA</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 20px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #fff; text-align: center; }
        button { width: 95%; padding: 12px; background-color: #e67e22; border: none; border-radius: 5px; color: white; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #d35400; }
        .hidden { display: none; }
        .stat-card { background: #2c3e50; padding: 10px; margin: 5px 0; border-radius: 5px; text-align: right; padding-right: 15px; }
    </style>
</head>
<body>

    <div id="loginBox" class="box">
        <h2>قفل الأمان: لوحة الوكلاء</h2>
        <p>أدخل رمز الوكيل المعتمد للدخول</p>
        <input type="password" id="agentCode" placeholder="أدخل الرمز هنا...">
        <button onclick="checkAgent()">التحقق من الإذن</button>
    </div>

    <div id="dashboard" class="box hidden">
        <h2>أهلاً بك يا وكيل DEKSA 👋</h2>
        <hr>
        <div class="stat-card">🪙 مخزون الكوينز: <span id="coins">0</span></div>
        <div class="stat-card">⭐ باقات VIP 1 المتوفرة: <span id="vip1">0</span></div>
        <div class="stat-card">⭐ باقات VIP 2 المتوفرة: <span id="vip2">0</span></div>
        <div class="stat-card">⭐ باقات VIP 3 المتوفرة: <span id="vip3">0</span></div>
        <div class="stat-card">⭐ باقات VIP 4 المتوفرة: <span id="vip4">0</span></div>
        <div class="stat-card">⭐ باقات VIP 5 المتوفرة: <span id="vip5">0</span></div>
        <div class="stat-card">⭐ باقات VIP 6 المتوفرة: <span id="vip6">0</span></div>
        <br>
        <input type="text" id="userId" placeholder="أدخل ID حساب اللاعب">
        <button onclick="sendToUser()">اشحن للمستخدم الآن</button>
    </div>

    <script>
        // رابط قاعدة بيانات فيربيز الخاصة بمشروعك مباشرة
        const dbUrl = "https://deksa-f5b61-default-rtdb.asia-southeast1.firebasedatabase.app/agents";

        async function checkAgent() {
            const code = document.getElementById('agentCode').value.trim();
            if(!code) { alert('الرجاء إدخال الرمز أولاً!'); return; }

            try {
                const response = await fetch(`${dbUrl}/${code}.json`);
                const data = await response.json();

                if(data && data.active === true) {
                    document.getElementById('loginBox').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    
                    document.getElementById('coins').innerText = data.coinsStock.toLocaleString();
                    document.getElementById('vip1').innerText = data.vip1_count;
                    document.getElementById('vip2').innerText = data.vip2_count;
                    document.getElementById('vip3').innerText = data.vip3_count;
                    document.getElementById('vip4').innerText = data.vip4_count;
                    document.getElementById('vip5').innerText = data.vip5_count;
                    document.getElementById('vip6').innerText = data.vip6_count;
                } else {
                    alert('عذراً، هذا الرمز غير مسجل أو حساب الوكيل معطل!');
                }
            } catch (error) {
                alert('حدث خطأ أثناء الاتصال بقاعدة البيانات، تأكد من اتصالك بالإنترنت.');
                console.error(error);
            }
        }

        function sendToUser() {
            const id = document.getElementById('userId').value;
            if(!id) { alert('يرجى إدخال ID اللاعب!'); return; }
            alert('تم إرسال طلب الشحن بنجاح وجاري المعالجة كمسؤول!');
        }
    </script>
</body>
</html>
