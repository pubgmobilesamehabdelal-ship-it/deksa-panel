<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة شحن وكلاء DEKSA</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 350px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #252525; color: #fff; text-align: center; }
        button { width: 95%; padding: 12px; background: #ff9800; border: none; color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background: #e68a00; }
        .hidden { display: none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="loginBox" class="box">
        <h2>قفل الأمان: لوحة الوكلاء</h2>
        <p>أدخل رمز الوكيل المعتمد للدخول</p>
        <input type="password" id="agentToken" placeholder="أدخل الرمز السري هنا">
        <button onclick="checkAccess()">التحقق من الإذن</button>
    </div>

    <div id="controlPanel" class="box hidden">
        <h2>لوحة شحن الكوينزات المعتمدة</h2>
        <hr>
        <input type="text" id="userUid" placeholder="معرف المستخدم (UID)">
        <input type="number" id="coinsAmount" placeholder="عدد الكوينزات">
        <button onclick="sendCoins()">تأكيد شحن الرصيد</button>
        <p id="status" style="color: #4caf50; font-weight: bold;"></p>
    </div>

    <script>
        // إعدادات Firebase المأخوذة من تطبيقك DEKSA مباشرة
        const firebaseConfig = {
            apiKey: "AlzaSyC5RGml-PoOk7CV9FlvphOgTSTA4RsmA7w",
            databaseURL: "https://deksa-f5b61-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "deksa-f5b61"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function checkAccess() {
            const token = document.getElementById('agentToken').value;
            database.ref('agents/' + token).once('value', (snapshot) => {
                if (snapshot.exists() && snapshot.val() === true) {
                    document.getElementById('loginBox').classList.add('hidden');
                    document.getElementById('controlPanel').classList.remove('hidden');
                } else {
                    alert('عذراً، ليس لديك إذن لدخول اللوحة أو الرمز غير صحيح!');
                }
            });
        }

        function sendCoins() {
            const uid = document.getElementById('userUid').value;
            const amount = parseInt(document.getElementById('coinsAmount').value);
            const statusText = document.getElementById('status');

            if(!uid || !amount) { alert('يرجى ملء جميع الحقول'); return; }

            const userCoinsRef = database.ref('users/' + uid + '/coins');
            userCoinsRef.transaction((currentCoins) => {
                return (currentCoins || 0) + amount;
            }, (error, committed, snapshot) => {
                if (committed) {
                    statusText.innerText = "تم شحن " + amount + " كوينز بنجاح!";
                    document.getElementById('userUid').value = "";
                    document.getElementById('coinsAmount').value = "";
                } else {
                    statusText.innerText = "فشلت العملية، تأكد من الـ UID";
                }
            });
        }
    </script>
</body>
</html>
