<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة شحن وكلاء DEKSA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { margin-bottom: 25px; color: #fff; }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 25px; border-bottom: 2px solid #333; }
        .tab-btn {
            background: none; border: none; color: #aaa; padding: 10px 20px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { color: #ff8c00; border-bottom: 3px solid #ff8c00; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #main-panel { display: none; }
        .info-box {
            background-color: #2a3a4a; padding: 12px; margin-bottom: 12px;
            border-radius: 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .input-group { margin-bottom: 18px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #ccc; }
        input {
            width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #444;
            background-color: #252525; color: #fff; box-sizing: border-box; font-size: 15px; outline: none;
        }
        input:focus { border-color: #ff8c00; }
        .btn-submit {
            background-color: #e65c00; color: white; border: none; padding: 14px;
            width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background-color: #ff6a00; }
    </style>
</head>
<body>

<div class="container">

    <!-- شاشة قفل الأمان المباشرة -->
    <div id="login-screen">
        <h2>قفل الأمان: لوحة الوكلاء</h2>
        <div class="input-group">
            <label>أدخل رمز الوكيل المعتمد للدخول:</label>
            <input type="password" id="agent-code-input" placeholder="••••••••••••">
        </div>
        <button class="btn-submit" onclick="checkAgentLogin()">التحقق من الإذن</button>
    </div>

    <!-- لوحة التحكم الرئيسية الكاملة -->
    <div id="main-panel">
        <h2 id="welcome-title">أهلاً بك يا وكيل DEKSA 👋</h2>
        
        <div id="stock-panel">
            <div class="info-box">
                <span>🪙 مخزون الكوينز الحالي:</span>
                <span id="coins-display">3,700,000</span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('shahan-tab', event)">الشحن</button>
            <button class="tab-btn" onclick="switchTab('tarheeb-tab', event)">الترحيبات</button>
        </div>

        <!-- قسم الشحن الحُر -->
        <div id="shahan-tab" class="tab-content active">
            <div class="input-group">
                <label>ادخل ID المستخدم:</label>
                <input type="text" id="shahan-id" placeholder="اكتب ID المستخدم هنا...">
            </div>
            
            <div class="input-group">
                <label>عدد الكوينزات:</label>
                <input type="number" id="coins-input" placeholder="مثال: 100000">
            </div>

            <div class="input-group">
                <label>عدد المبلغ ($):</label>
                <input type="number" id="price-input" placeholder="مثال: 10" step="0.01">
            </div>
            
            <button class="btn-submit" onclick="processShipping()">اشحن للمستخدم الآن</button>
        </div>

        <!-- قسم الترحيبات الحُر -->
        <div id="tarheeb-tab" class="tab-content">
            <div class="input-group">
                <label>ادخل ID المستخدم:</label>
                <input type="text" id="tarheeb-id" placeholder="اكتب ID المستخدم هنا...">
            </div>
            
            <div class="input-group">
                <label>عدد الترحيب (VIP):</label>
                <input type="text" id="welcome-vip-input" placeholder="مثال: VIP 1">
            </div>

            <div class="input-group">
                <label>عدد الأيام في الترحيبات:</label>
                <input type="number" id="welcome-days-input" placeholder="اكتب عدد الأيام يدوياً...">
            </div>
            
            <button class="btn-submit" onclick="processWelcome()">تفعيل الترحيب الحُر الآن</button>
        </div>
    </div>

</div>

<script>
    const dbUrl = "https://deksa-f5b61-default-rtdb.asia-southeast1.firebaseio.com/agents";
    let currentAgent = "";
    let currentStock = 3700000; // المخزون الافتراضي الذكي المعتمد من قبلك

    function checkAgentLogin() {
        const code = document.getElementById('agent-code-input').value.trim();
        if (!code) { alert('الرجاء إدخال الرمز!'); return; }

        currentAgent = code;
        
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-panel').style.display = 'block';
        document.getElementById('welcome-title').innerText = "أهلاً بك يا وكيل " + code + " 👋";

        // محاولة تحديث الرصيد من السيرفر إن كان مسجلاً هناك بالفعل
        fetch(`${dbUrl}/${code}.json`)
        .then(res => res.json())
        .then(data => {
            if(data && data.coinsStock !== undefined) {
                currentStock = parseInt(data.coinsStock);
                document.getElementById('coins-display').innerText = currentStock.toLocaleString();
            }
        })
        .catch(() => {});
    }

    function switchTab(tabId, event) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(event && event.currentTarget) {
            event.currentTarget.classList.add('active');
        }
    }

    // دالة الشحن الذكية مع الخصم الفوري والمباشر
    function processShipping() {
        const userId = document.getElementById('shahan-id').value.trim();
        const coins = parseInt(document.getElementById('coins-input').value);
        const price = parseFloat(document.getElementById('price-input').value);

        if(!userId || isNaN(coins) || isNaN(price)) {
            alert('يرجى إدخال الحقول بشكل صحيح!');
            return;
        }

        if (currentStock < coins) {
            alert('المخزون الحالي غير كافٍ لإتمام عملية الشحن!');
            return;
        }

        // تنفيذ الخصم الفوري محليًا على الواجهة
        currentStock -= coins;
        document.getElementById('coins-display').innerText = currentStock.toLocaleString();

        alert('تم طلب شحن ' + coins + ' كوينز للمخدم ID: ' + userId + ' بنجاح!');
        
        // تحديث القيمة المخصومة في الفايربيز بالخلفية
        fetch(`${dbUrl}/${currentAgent}.json`, {
            method: 'PATCH',
            body: JSON.stringify({ 
                coinsStock: currentStock,
                lastAction: `Shipped ${coins} to ${userId}` 
            })
        }).catch(()=>{});

        document.getElementById('shahan-id').value = ""; 
        document.getElementById('coins-input').value = ""; 
        document.getElementById('price-input').value = "";
    }

    function processWelcome() {
        const userId = document.getElementById('tarheeb-id').value.trim();
        const vipSelected = document.getElementById('welcome-vip-input').value.trim();
        const welcomeDays = parseInt(document.getElementById('welcome-days-input').value);

        if(!userId || !vipSelected || isNaN(welcomeDays)) {
            alert('يرجى ملء جميع الحقول بشكل صحيح!');
            return;
        }

        alert('تم تفعيل ' + vipSelected + ' للمستخدم ID: ' + userId + ' لمدة ' + welcomeDays + ' أيام بنجاح!');
        
        document.getElementById('tarheeb-id').value = "";
        document.getElementById('welcome-vip-input').value = "";
        document.getElementById('welcome-days-input').value = "";
    }
</script>
</body>
</html>
