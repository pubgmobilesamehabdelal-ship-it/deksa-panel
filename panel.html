<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة DEKSA</title>
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #252525; color: #fff; box-sizing: border-box; }
        .btn-submit { background: #e65c00; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; }
        #main-panel { display: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة الدخول -->
    <div id="login-screen">
        <h2>تسجيل دخول الوكيل</h2>
        <input type="text" id="agent-code" placeholder="أدخل رمز الوكيل...">
        <button class="btn-submit" id="login-btn" onclick="tryLogin()">دخول</button>
    </div>

    <!-- اللوحة الرئيسية -->
    <div id="main-panel">
        <h2 id="welcome-msg">مرحباً</h2>
        <div class="info-box">🪙 الرصيد: <span id="coins-display">0</span></div>
        <button class="btn-submit" onclick="showTab('shahan')">قسم الشحن</button>
        <button class="btn-submit" onclick="showTab('tarheeb')">قسم الترحيب</button>

        <div id="shahan" class="tab-content">
            <input type="text" id="sid" placeholder="ID المستخدم">
            <input type="number" id="scoin" placeholder="الكوينز">
            <button class="btn-submit" onclick="doShip()">تنفيذ الشحن</button>
        </div>
        
        <div id="tarheeb" class="tab-content">
            <input type="text" id="tid" placeholder="ID المستخدم">
            <input type="text" id="tvip" placeholder="نوع VIP">
            <button class="btn-submit" onclick="doWelcome()">تفعيل الترحيب</button>
        </div>
    </div>
</div>

<script>
    // 1. إعدادات ذكية مع تأمين الاتصال
    const firebaseConfig = { databaseURL: "https://deksa-f5b61-default-rtdb.asia-southeast1.firebaseio.com" };
    
    // 2. التحقق من التهيئة
    window.onload = function() {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            console.log("تم تهيئة Firebase بنجاح");
        }
    };

    function tryLogin() {
        const code = document.getElementById('agent-code').value.trim();
        const btn = document.getElementById('login-btn');
        
        if (!code) { alert("أدخل الرمز أولاً"); return; }
        
        btn.innerText = "جاري التحقق...";
        
        // 3. قراءة البيانات (تأكد أن قاعدة بياناتك تسمح بالقراءة)
        firebase.database().ref('agents/' + code).once('value')
        .then(function(snapshot) {
            btn.innerText = "دخول";
            if (snapshot.exists()) {
                const data = snapshot.val();
                if (data.active === true || data.active === "true") {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-panel').style.display = 'block';
                    document.getElementById('coins-display').innerText = data.coinsStock || 0;
                    document.getElementById('welcome-msg').innerText = "أهلاً بك: " + code;
                } else {
                    alert("حسابك غير مفعل!");
                }
            } else {
                alert("رمز غير موجود في القاعدة");
            }
        })
        .catch(function(error) {
            btn.innerText = "دخول";
            console.error("خطأ:", error);
            alert("خطأ في الاتصال: تأكد من إعدادات Firebase Rules.");
        });
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function doShip() { alert("تم الشحن!"); }
    function doWelcome() { alert("تم الترحيب!"); }
</script>
</body>
</html>
