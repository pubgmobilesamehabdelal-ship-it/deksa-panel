<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة شحن وكلاء DEKSA</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 25px;
            color: #fff;
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            border-bottom: 2px solid #333;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #aaa;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            color: #ff8c00;
            border-bottom: 3px solid #ff8c00;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .info-box {
            background-color: #2a3a4a;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #444;
            background-color: #252525;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #ff8c00;
        }
        .btn-submit {
            background-color: #e65c00;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #ff6a00;
        }
        .hint {
            font-size: 12px;
            color: #ffaa00;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>أهلاً بك يا وكيل DEKSA 👋</h2>
    
    <!-- الأقسام المتوفرة للوكيل -->
    <div id="stock-panel">
        <div class="info-box">
            <span>🪙 مخزون الكوينز الحلي:</span>
            <span id="coins-display">3,700,000</span>
        </div>
    </div>

    <!-- أزرار الفصل بين الشحن والترحيبات -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('shahan-tab')">الشحن</button>
        <button class="tab-btn" onclick="switchTab('tarheeb-tab')">الترحيبات</button>
    </div>

    <!-- ================= قسم الشحن (كامل الحرية) ================= -->
    <div id="shahan-tab" class="tab-content active">
        <div class="input-group">
            <label>ادخل ID المستخدم:</label>
            <input type="text" id="shahan-id" placeholder="اكتب ID اللاعب هنا...">
        </div>
        
        <div class="input-group">
            <label>عدد الكوينزات المراد شحنها:</label>
            <input type="number" id="coins-input" placeholder="مثال: 3500">
            <span class="hint">* الحد الأدنى للشحن هو 3500 كوينز</span>
        </div>

        <div class="input-group">
            <label>المبلغ المطلوب ($):</label>
            <input type="number" id="price-input" placeholder="مثال: 1" step="0.01">
            <span class="hint">* الحد الأدنى للمبلغ هو 1$</span>
        </div>
        
        <button class="btn-submit" onclick="processShipping()">اشحن للمستخدم الآن</button>
    </div>

    <!-- ================= قسم الترحيبات ================= -->
    <div id="tarheeb-tab" class="tab-content">
        <div class="input-group">
            <label>ادخل ID المستخدم:</label>
            <input type="text" id="tarheeb-id" placeholder="اكتب ID اللاعب هنا...">
        </div>
        
        <div class="input-group">
            <label>اختر باقة الترحيب (المدة: 7 أيام فقط):</label>
            <select id="vip-package">
                <option value="vip1">باقة VIP 1 ترحيبية (7 أيام)</option>
                <option value="vip2">باقة VIP 2 ترحيبية (7 أيام)</option>
                <option value="vip3">باقة VIP 3 ترحيبية (7 أيام)</option>
                <option value="vip4">باقة VIP 4 ترحيبية (7 أيام)</option>
                <option value="vip5">باقة VIP 5 ترحيبية (7 أيام)</option>
                <option value="vip6">باقة VIP 6 ترحيبية (7 أيام)</option>
            </select>
        </div>
        
        <button class="btn-submit" onclick="processWelcome()">تفعيل الترحيب (7 أيام)</button>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function processShipping() {
        const userId = document.getElementById('shahan-id').value;
        const coins = parseInt(document.getElementById('coins-input').value);
        const price = parseFloat(document.getElementById('price-input').value);

        if(!userId) {
            alert('يرجى إدخال ID المستخدم أولاً!');
            return;
        }
        if(isNaN(coins) || coins < 3500) {
            alert('خطأ: أقل كمية شحن مسموح بها هي 3500 كوينز!');
            return;
        }
        if(isNaN(price) || price < 1) {
            alert('خطأ: أدنى مبلغ شحن مسموح به هو 1$!');
            return;
        }

        // إذا تخطى الشروط يتم الشحن بحرية كاملة
        alert('تم بنجاح طلب شحن ' + coins + ' كوينز بقيمة ' + price + '$ للحساب ID: ' + userId);
    }

    function processWelcome() {
        const userId = document.getElementById('tarheeb-id').value;
        const vipSelected = document.getElementById('vip-package').value;
        if(!userId) {
            alert('يرجى إدخال ID المستخدم لتفعيل الترحيب!');
            return;
        }
        alert('تم تفعيل ' + vipSelected + ' للمتصفح ID: ' + userId + ' لمدة 7 أيام بنجاح!');
    }
</script>
</body>
</html>
