<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة DEKSA</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 420px; text-align: center; }
        .tabs { display: flex; justify-content: space-around; margin: 20px 0; border-bottom: 2px solid #333; }
        .tab-btn { background: none; border: none; color: #aaa; padding: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #ff8c00; border-bottom: 3px solid #ff8c00; }
        .tab-content, #main-panel { display: none; }
        .info-box { background: #2a3a4a; padding: 12px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #444; background: #252525; color: #fff; box-sizing: border-box; outline: none; }
        input:focus, select:focus { border-color: #ff8c00; }
        .btn-submit { background: #e65c00; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .hint { font-size: 11px; color: #ffaa00; display: block; margin-top: 4px; }
    </style>
</head>
<body>
<div class="container">
    <!-- شاشة قفل الأمان -->
    <div id="login-screen">
        <h2>قفل الأمان: لوحة الوكلاء</h2>
        <div class="input-group">
            <label>أدخل رمز الوكيل المعتمد للدخول:</label>
            <input type="password" id="agent-code-input" placeholder="••••••••••••">
        </div>
        <button class="btn-submit" onclick="checkAgentLogin()">التحقق من الإذن</button>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="main-panel">
        <h2 id="welcome-title">لوحة الوكيل 👋</h2>
        <div class="info-box"><span>🪙 مخزون الكوينز:</span><span id="coins-display">0</span></div>
        <div class="info-box"><span>⭐ باقة VIP 1 المتوفرة:</span><span id="vip1-display">0</span></div>
        <div class="info-box"><span>⭐ باقة VIP 2 المتوفرة:</span><span id="vip2-display">0</span></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('shahan-tab')">الشحن</button>
            <button class="tab-btn" onclick="switchTab('tarheeb-tab')">الترحيبات</button>
        </div>

        <!-- قسم الشحن الحُر -->
        <div id="shahan-tab" class="tab-content" style="display: block;">
            <div class="input-group"><label>ادخل ID المستخدم:</label><input type="text" id="shahan-id" placeholder="ID اللاعب..."></div>
            <div class="input-group">
                <label>عدد الكوينزات:</label><input type="number" id="coins-input" placeholder="مثال: 3500">
                <span class="hint">* الحد الأدنى 3500 كوينز</span>
            </div>
            <div class="input-group">
                <label>المبلغ المطلوب ($):</label><input type="number" id="price-input" placeholder="مثال: 1" step="0.01">
                <span class="hint">* الحد الأدنى 1$</span>
            </div>
            <button class="btn-submit" onclick="processShipping()">اشحن للمستخدم الآن</button>
        </div>

        <!-- قسم الترحيبات صالحة لمدة 7 أيام -->
        <div id="tarheeb-tab" class="tab-content">
            <div class="input-group"><label>ادخل ID المستخدم:</label><input type="text" id="tarheeb-id" placeholder="ID اللاعب..."></div>
            <div class="input-group">
                <label>اختر باقة الترحيب (7 أيام فقط):</label>
                <select id="vip-package">
                    <option value="vip1">باقة VIP 1 ترحيبية (7 أيام)</option>
                    <option value="vip2">باقة VIP 2 ترحيبية (7 أيام)</option>
                </select>
            </div>
            <button class="btn-submit" onclick="processWelcome()">تفعيل الترحيب (7 أيام)</button>
        </div>
    </div>
</div>

<script>
    firebase.initializeApp({ databaseURL: "https://deksa-f5b61-default-rtdb.asia-southeast1.firebaseio.com" });
    const database = firebase.database();
    let currentAgent = "";

    function checkAgentLogin() {
        const code = document.getElementById('agent-code-input').value.trim();
        database.ref('agents/' + code).once('value').then((snapshot) => {
            if (snapshot.exists() && snapshot.val().active === true) {
                currentAgent = code;
                updateDisplays(snapshot.val());
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-panel').style.display = 'block';
            } else { alert('عذراً، الرمز غير مسجل أو الحساب معطل!'); }
        });
    }

    function updateDisplays(data) {
        document.getElementById('coins-display').innerText = Number(data.coinsStock).toLocaleString();
        document.getElementById('vip1-display').innerText = data.vip1_count || 0;
        document.getElementById('vip2-display').innerText = data.vip2_count || 0;
        document.getElementById('welcome-title').innerText = "أهلاً بك يا وكيل " + currentAgent + " 👋";
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    function processShipping() {
        const id = document.getElementById('shahan-id').value.trim();
        const coins = parseInt(document.getElementById('coins-input').value);
        const price = parseFloat(document.getElementById('price-input').value);

        if(!id || isNaN(coins) || coins < 3500 || isNaN(price) || price < 1) {
            alert('خطأ: تحقق من البيانات (أدنى شحن 3500 كوينز بـ 1$)!'); return;
        }

        database.ref('agents/' + currentAgent + '/coinsStock').transaction(stock => (stock >= coins) ? stock - coins : undefined, (err, comm, snap) => {
            if (comm) {
                document.getElementById('coins-display').innerText = Number(snap.val()).toLocaleString();
                alert(`تم شحن ${coins} كوينز بقيمة ${price}$ لـ ID: ${id}`);
                document.getElementById('shahan-id').value = ""; document.getElementById('coins-input').value = ""; document.getElementById('price-input').value = "";
            } else { alert('المخزون غير كافٍ!'); }
        });
    }

    function processWelcome() {
        const id = document.getElementById('tarheeb-id').value.trim();
        const vip = document.getElementById('vip-package').value;
        if(!id) { alert('ادخل ID المستخدم!'); return; }

        database.ref(`agents/${currentAgent}/${vip}_count`).transaction(count => (count > 0) ? count - 1 : undefined, (err, comm, snap) => {
            if (comm) {
                document.getElementById(`${vip}-display`).innerText = snap.val();
                alert(`تم تفعيل ${vip} لـ ID: ${id} لمدة 7 أيام!`);
                document.getElementById('tarheeb-id').value = "";
            } else { alert('لا توجد باقات كافية!'); }
        });
    }
</script>
</body>
</html>
